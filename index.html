<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiệm Anh Già - Hardware & Server</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
</head>
<body>
    <header class="glass-header">
        <div class="logo"><span class="cmd-prompt">root@tiemanhgia:~#</span> Tiệm Anh Già</div>
        <nav>
            <ul id="menu">
                <li><a href="#" data-target="home" class="active">Trang chủ</a></li>
                <li><a href="#" data-target="iot">Dự án IOT</a></li>
                <li><a href="#" data-target="embedded">Dự án Nhúng</a></li>
            </ul>
        </nav>
    </header>

    <main id="app-content">
        <!-- Section Home -->
        <section id="home" class="content-section active">
            <h1>Welcome to <span class="highlight">Tiệm Anh Già</span></h1>
        </section>

        <!-- Section IOT -->
        <section id="iot" class="content-section">
            <h2>Dự án IOT</h2>
            <div id="iot-container" class="grid-container">
                <!-- Dữ liệu sẽ được JS render vào đây -->
            </div>
        </section>

        <!-- Section Nhúng -->
        <section id="embedded" class="content-section">
            <h2>Dự án Nhúng</h2>
            <div id="embedded-container">
                <!-- Dữ liệu sẽ được JS render vào đây -->
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
